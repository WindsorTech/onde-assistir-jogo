<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Onde Assistir o Jogo?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff; /* Fundo Branco */
            color: #1a1a1a; /* Texto Escuro para contraste */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #808080;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #808080;
            letter-spacing: -0.5px;
        }

        .tabela {
            margin-top: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input {
            width: 100%;
            padding: 16px;
            font-size: 20px; /* Evita o zoom automático no iOS */
            background-color: #f5f7fa; /* Fundo cinza bem claro para o campo */
            border: 2px solid #ccd6e0; /* Contorno suave */
            border-radius: 12px;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }

        input:focus {
            border-color: #0066cc; /* Contorno Azul ao selecionar */
            background-color: #ffffff;
        }

        input::placeholder {
            color: #8a99a8;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            background-color: #0066cc; /* Botão Azul */
            color: #ffffff; /* Letra branca no botão para leitura limpa */
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            background-color: #004499; /* Azul mais escuro ao tocar */
            transform: scale(0.98); /* Feedback de clique no celular */
        }
    </style>

    <!-- Facebook Share Image -->
      <meta property="og:image" content="images/onde-bola.jpg">
      <!-- Favicon Image -->
      <link rel="icon" href="images/bola-icon.ico" type="image/x-icon">

</head>
<body>  

<div class="app-container">
    <h1>Onde Assistir o Jogo?</h1>
    <h1>⚽️🏀🏐🏈🥎</h1>
    <form onsubmit="buscarJogo(event)">
        <input 
            type="text" 
            id="matchInput" 
            placeholder="Quem vai jogar?" 
            required 
            autofocus 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="words"
        >
       <!-- <button type="submit">Buscar</button> -->
    </form>

    <h1 class="tabela">🗓️ Tabela 🗓️</h1>
    <form onsubmit="buscarTabela(event)">
        <input 
            type="text" 
            id="champInput" 
            placeholder="Qual o campeonato?" 
            required 
            autofocus 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="words"
        >
    </form>

    <h1 class="tabela">📈 Transferências 📉</h1>
    <form onsubmit="buscarJogador(event)">
        <input 
            type="text" 
            id="playerInput" 
            placeholder="Qual o jogador?" 
            required 
            autofocus 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="words"
        >
    </form>

    <h2 class="tabela">by WindsorTech</h2>

</div>

<script>
    function buscarJogo(event) {
        event.preventDefault(); 
        
        const matchInfo = document.getElementById('matchInput').value.trim();
        if (matchInfo === "") return;

        const query = `${matchInfo} onde assistir uol`;
        const googleUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;

        // ALTERAÇÃO AQUI: Força o navegador atual a abrir o link sem disparar o app do Google
        window.location.replace(googleUrl);
    }

    function buscarTabela(event) {
        event.preventDefault(); 
        
        const matchInfo = document.getElementById('champInput').value.trim();
        if (matchInfo === "") return;

        const query = `${matchInfo} tabela globo esporte ge`;
        const googleUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;

        // ALTERAÇÃO AQUI: Força o navegador atual a abrir o link sem disparar o app do Google
        window.location.replace(googleUrl);
    }

    function buscarJogador(event) {
        event.preventDefault(); 
        
        const matchInfo = document.getElementById('playerInput').value.trim();
        if (matchInfo === "") return;

        const query = `${matchInfo} transfermarkt player transfers`;
        const googleUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;

        // ALTERAÇÃO AQUI: Força o navegador atual a abrir o link sem disparar o app do Google
        window.location.replace(googleUrl);
    }
</script>

</div>

</body>
</html>
